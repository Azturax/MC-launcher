[package]
name = "aureum"
version = "0.1.0-dev"
description = "Aureum — a third-party Minecraft instance manager"
authors = ["Aureum"]
edition = "2021"
rust-version = "1.84"

[lib]
name = "aureum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
keyring = "3"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
urlencoding = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
which = "7"
open = "5"
log = "0.4"
env_logger = "0.11"
dotenvy = "0.15"
sysinfo = "0.35"
walkdir = "2"
futures-util = "0.3"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
